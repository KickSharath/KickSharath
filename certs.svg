<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 52">
<defs>
<style>
:root{--tc:#58a6ff;--bg:#0078D41a;--bd:#0078D444}
@media(prefers-color-scheme:light){:root{--tc:#0550ae;--bg:#0078D40f;--bd:#0078D455}}
.p{fill:var(--bg);stroke:var(--bd);stroke-width:.5}
.t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:12px;fill:var(--tc);font-weight:500}
.f1{animation:pop .5s .1s both}.f2{animation:pop .5s .2s both}
.f3{animation:pop .5s .3s both}.f4{animation:pop .5s .4s both}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</defs>

<g class="f1">
  <rect class="p" x="15" y="8" width="196" height="36" rx="7"/>
  <text class="t" x="113" y="30" text-anchor="middle" dominant-baseline="central">Microsoft 365 Fundamentals</text>
</g>

<g class="f2">
  <rect class="p" x="223" y="8" width="222" height="36" rx="7"/>
  <text class="t" x="334" y="30" text-anchor="middle" dominant-baseline="central">Azure AI Fundamentals — AI-900</text>
</g>

<g class="f3">
  <rect class="p" x="457" y="8" width="202" height="36" rx="7"/>
  <text class="t" x="558" y="30" text-anchor="middle" dominant-baseline="central">Azure Fundamentals — AZ-900</text>
</g>

<g class="f4">
  <rect class="p" x="671" y="8" width="214" height="36" rx="7"/>
  <text class="t" x="778" y="30" text-anchor="middle" dominant-baseline="central">Security &amp; Compliance — SC-900</text>
</g>
</svg>
