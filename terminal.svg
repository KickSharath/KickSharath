<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 236">
<defs>
<style>
:root{--bg:#0d1117;--bar:#161b22;--bd:#30363d;--t:#e6edf3;--m:#8b949e;--g:#3fb950;--b:#58a6ff;--y:#e3b341;--p:#d2a8ff}
@media(prefers-color-scheme:light){:root{--bg:#ffffff;--bar:#f6f8fa;--bd:#d0d7de;--t:#24292f;--m:#57606a;--g:#1a7f37;--b:#0969da;--y:#9a6700;--p:#8250df}}
.bg{fill:var(--bg)}.bar{fill:var(--bar)}.bd{stroke:var(--bd);stroke-width:.5;fill:none}
.mn{font-family:"Cascadia Code","Fira Code","Courier New",monospace;font-size:13px}
.tc{fill:var(--t)}.mc{fill:var(--m)}.gc{fill:var(--g)}.bc{fill:var(--b)}.yc{fill:var(--y)}.pc{fill:var(--p)}
.cur{fill:var(--b);animation:blink 1s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.a1{animation:fade .08s .3s both}
.a2{animation:fade .08s .9s both}
.a3{animation:fade .08s 1.6s both}
.a4{animation:fade .08s 2.0s both}
.a5{animation:fade .08s 2.3s both}
.a6{animation:fade .08s 2.6s both}
.a7{animation:fade .08s 2.9s both}
.a8{animation:fade .08s 3.3s both}
.a9{animation:fade .08s 3.7s both}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
</style>
</defs>

