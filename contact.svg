<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 52">
<defs>
<style>
:root{--pill:#161b22;--b:#30363d;--t:#e6edf3;--m:#8b949e}
@media(prefers-color-scheme:light){:root{--pill:#f6f8fa;--b:#d0d7de;--t:#24292f;--m:#57606a}}
.p{fill:var(--pill);stroke:var(--b);stroke-width:.5}
.lbl{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:12px;font-weight:500;fill:var(--t)}
.sub{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:10px;fill:var(--m)}
.fade{animation:pop .5s both cubic-bezier(.2,0,.2,1)}
.f1{animation-delay:.05s}.f2{animation-delay:.15s}.f3{animation-delay:.25s}.f4{animation-delay:.35s}.f5{animation-delay:.45s}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</defs>

<g class="fade f1">
<rect class="p" x="25" y="8" width="130" height="36" rx="7"/>
<rect x="38" y="17" width="16" height="16" rx="3" fill="#0A66C2"/>
<text x="44" y="29" text-anchor="middle" fill="white" font-family="sans-serif" font-size="9" font-weight="700">in</text>
<text class="lbl" x="60" y="23">LinkedIn</text>
<text class="sub" x="60" y="35">rangu-sharath-babu</text>
</g>

<g class="fade f2">
<rect class="p" x="165" y="8" width="268" height="36" rx="7"/>
<rect x="178" y="17" width="16" height="16" rx="3" fill="#EA4335"/>
<text x="184" y="29" text-anchor="middle" fill="white" font-family="sans-serif" font-size="9" font-weight="700">M</text>
<text class="lbl" x="202" y="23">Gmail</text>
<text class="sub" x="202" y="35">rangusharathbabu@gmail.com</text>
</g>

<g class="fade f3">
<rect class="p" x="443" y="8" width="138" height="36" rx="7"/>
<rect x="456" y="17" width="16" height="16" rx="8" fill="#24292f"/>
<text x="464" y="29" text-anchor="middle" fill="white" font-family="sans-serif" font-size="8" font-weight="700">GH</text>
<text class="lbl" x="480" y="23">GitHub</text>
<text class="sub" x="480" y="35">KickSharath</text>
</g>

<g class="fade f4">
<rect class="p" x="591" y="8" width="152" height="36" rx="7"/>
<rect x="604" y="18" width="6" height="6" rx="3" fill="#8b949e"/>
<rect x="607" y="20" width="1" height="8" fill="#8b949e"/>
<text class="lbl" x="620" y="23">Location</text>
<text class="sub" x="620" y="35">Hyderabad, India</text>
</g>

<g class="fade f5">
<rect x="753" y="8" width="122" height="36" rx="7" fill="#2ea44f1a" stroke="#2ea44f55" stroke-width=".5"/>
<rect x="766" y="18" width="8" height="8" rx="4" fill="#2ea44f"/>
<text class="lbl" x="783" y="23" font-size="11" fill="#2ea44f">Open to Work</text>
<text class="sub" x="783" y="35" fill="#3fb950">AI / Full Stack</text>
</g>
</svg>
