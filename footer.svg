<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 48">
<defs>
<style>
:root{--line:#30363d;--link:#58a6ff;--muted:#8b949e}
@media(prefers-color-scheme:light){:root{--line:#d0d7de;--link:#0969da;--muted:#57606a}}
.mn{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px}
.fade{animation:fadein .6s .4s both}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</defs>

<line x1="0" y1="1" x2="900" y2="1" stroke="var(--line)" stroke-width=".5"/>

<g class="fade">
  <text class="mn" x="450" y="30" text-anchor="middle" dominant-baseline="central">
    <tspan fill="var(--link)">linkedin.com/in/rangu-sharath-babu</tspan>
    <tspan fill="var(--muted)">  ·  Hyderabad, India</tspan>
  </text>
</g>
</svg>
